name: MacSupport CI

on:
  push:
    branches:
      - feature/booking-ui-professional
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npx eslint components/BookingCalendarPicker.tsx components/UnifiedSupportForm.tsx app/api/booking/slots/route.ts app/api/booking/schedule/route.ts

      - name: Production build
        run: npm run build
